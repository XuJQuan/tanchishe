name: Web to GitHub Pages

# 每次 push master 或手动触发：构建 Web 版并发布到 GitHub Pages，
# 得到公开可访问的在线试玩地址（下载页"Web 在线版"卡片指向它）。
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true
      - run: flutter config --no-analytics
      - name: Build Web
        working-directory: snake
        run: flutter build web --release
      - name: Ensure Pages source is GitHub Actions
        run: |
          curl -sf -o /dev/null -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" \
            -d '{"source":{"branch":"master","path":"/"},"build_type":"workflows"}' \
            || echo '>> 自动开启失败，请到仓库 Settings -> Pages 手动选择 Source: GitHub Actions'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: snake/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
